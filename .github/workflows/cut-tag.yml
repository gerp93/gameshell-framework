# Template: copy to .github/workflows/cut-tag.yml in a Go *library* repo
# (gameshell-framework) or any repo whose "release" is just a semver git
# tag for downstream go.mod pinning — no build artifact.
#
# Downstream consumers pin with:
#   go get github.com/gerp93/gameshell-framework@vX.Y.Z

name: Cut Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to bump'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and push new tag
        run: |
          set -e
          GIT_TAG_VERSION=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          CURRENT_VERSION=${GIT_TAG_VERSION:-v0.0.0}
          CURRENT_VERSION=${CURRENT_VERSION#v}
          REGEX_VALID_VERSION="([0-9]+)\.([0-9]+)\.([0-9]+)"
          if [[ ! "$CURRENT_VERSION" =~ ^$REGEX_VALID_VERSION$ ]]; then
            echo "Exiting: current version not valid ($CURRENT_VERSION)" >&2
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}

          case "${{ inputs.bump }}" in
            major) MAJOR=$((10#$MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((10#$MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((10#$PATCH + 1)) ;;
          esac

          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_VERSION" -m "$NEW_VERSION"
          git push origin "$NEW_VERSION"
          echo "Tagged $NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"
